name: Frozen I CFS spot check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core004c-single-authorized-run
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'Amitly/agenthon-t3-runtime-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Fetch fixed public dependencies and selected LFS
        run: python prepare.py
      - name: Control checks (no simulations)
        env:
          PYTHONPATH: track-src
        run: python -m unittest -v test_controls
      - name: Frozen image and CFS checks, then bounded simulations
        run: |
          sudo env PATH="$PATH" \
            OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            python run_ci.py
      - name: Retain bounded new evidence
        if: always()
        run: sudo env PATH="$PATH" python retain.py
      - name: Upload one-day evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core004c-${{ github.run_id }}
          path: artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
